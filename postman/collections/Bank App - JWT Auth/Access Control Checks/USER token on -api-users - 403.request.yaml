$kind: http-request
name: USER token on /api/users -> 403
url: "{{baseUrl}}/api/users"
method: GET
headers:
  Authorization: Bearer {{userToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 (wrong role)', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 2000
